<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我要卖书</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="page-header">
            <a href="index.html" class="back-btn">←</a>
            <h1>我要卖书</h1>
            <div class="placeholder"></div>
        </header>

        <main class="sell-form-container">
            <form id="sellForm" class="sell-form" enctype="multipart/form-data">
                <div class="form-section">
                    <h3>📖 书籍信息</h3>
                    
                    <div class="form-group">
                        <label>书名 <span class="required">*</span></label>
                        <input type="text" name="title" required placeholder="请输入书名">
                    </div>

                    <div class="form-group">
                        <label>作者 <span class="required">*</span></label>
                        <input type="text" name="author" required placeholder="请输入作者">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>ISBN</label>
                            <input type="text" name="isbn" placeholder="可选">
                        </div>
                        <div class="form-group">
                            <label>原价</label>
                            <input type="number" name="originalPrice" step="0.01" placeholder="¥">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>期望售价 <span class="required">*</span></label>
                        <input type="number" name="price" step="0.01" required placeholder="¥">
                    </div>

                    <div class="form-group">
                        <label>书籍成色 <span class="required">*</span></label>
                        <select name="condition" required>
                            <option value="">请选择</option>
                            <option value="全新">全新 - 未拆封</option>
                            <option value="99新">99新 - 几乎无痕迹</option>
                            <option value="9成新">9成新 - 轻微使用痕迹</option>
                            <option value="8成新">8成新 - 有笔记但完整</option>
                            <option value="7成新">7成新 - 有明显使用痕迹</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>书籍描述</label>
                        <textarea name="description" rows="3" placeholder="描述书籍状况、是否有笔记等"></textarea>
                    </div>

                    <div class="form-group">
                        <label>书籍照片 <span class="required">*</span></label>
                        <div class="upload-area" id="uploadArea">
                            <input type="file" name="images" id="imageInput" multiple accept="image/*" required>
                            <div class="upload-placeholder">
                                <span class="upload-icon">📷</span>
                                <p>点击或拖拽上传照片</p>
                                <span class="upload-hint">最多5张，第一张为封面</span>
                            </div>
                        </div>
                        <div class="preview-grid" id="previewGrid"></div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>📞 联系方式</h3>
                    
                    <div class="form-group">
                        <label>联系人姓名 <span class="required">*</span></label>
                        <input type="text" name="contactName" required placeholder="请输入姓名">
                    </div>

                    <div class="form-group">
                        <label>手机号 <span class="required">*</span></label>
                        <input type="tel" name="contactPhone" required placeholder="请输入手机号">
                    </div>

                    <div class="form-group">
                        <label>微信号</label>
                        <input type="text" name="contactWechat" placeholder="方便买家联系">
                    </div>
                </div>

                <button type="submit" class="submit-sell-btn">提交卖书信息</button>
            </form>
        </main>

        <div class="toast" id="toast"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initSellPage();
        });
    </script>
</body>
</html>
