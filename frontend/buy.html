<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我要买书</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="buy-header">
            <a href="index.html" class="back-btn">←</a>
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="搜索书名、作者...">
                <button onclick="searchBooks()">搜索</button>
            </div>
            <div class="cart-icon" onclick="toggleCart()">
                🛒
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
        </header>

        <main class="books-grid" id="booksGrid">
            <div class="loading">正在加载书籍...</div>
        </main>

        <div class="cart-panel" id="cartPanel">
            <div class="cart-header">
                <h3>已选书籍</h3>
                <button onclick="toggleCart()">✕</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div>合计: <span class="total-price">¥<span id="totalPrice">0.00</span></span></div>
                <button class="checkout-btn" onclick="showCheckout()">去结算</button>
            </div>
        </div>

        <div class="modal-overlay" id="checkoutModal">
            <div class="modal">
                <div class="modal-header">
                    <h3>填写订单信息</h3>
                    <button onclick="closeCheckout()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>收货人姓名 *</label>
                        <input type="text" id="contactName" required placeholder="请输入姓名">
                    </div>
                    <div class="form-group">
                        <label>联系电话 *</label>
                        <input type="tel" id="contactPhone" required placeholder="请输入手机号">
                    </div>
                    <div class="form-group">
                        <label>收货地址 *</label>
                        <textarea id="address" required placeholder="请输入宿舍/教学楼地址" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>期望送达时间 *</label>
                        <input type="datetime-local" id="expectedTime" required>
                    </div>
                    <div class="form-group">
                        <label>备注（可选）</label>
                        <textarea id="note" placeholder="其他需求..." rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <div>总计: <span class="total-price">¥<span id="finalTotal">0.00</span></span></div>
                    <button class="submit-order-btn" onclick="submitOrder()">确认购买</button>
                </div>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchBooks();
            });
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(10, 0, 0, 0);
            document.getElementById('expectedTime').value = tomorrow.toISOString().slice(0, 16);
        });
    </script>
</body>
</html>
