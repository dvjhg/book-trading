<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校内二手书交易平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 50px;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .portal-card {
            background: white;
            color: #333;
            border-radius: 20px;
            padding: 40px 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .portal-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .portal-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .portal-card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #2d3748;
        }

        .portal-card p {
            color: #718096;
            font-size: 0.9rem;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        .admin-link {
            margin-top: 50px;
            opacity: 0.7;
        }

        .admin-link a {
            color: white;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .portal-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 校内二手书交易</h1>
        <p class="subtitle">让好书流动起来，让知识传递下去</p>

        <div class="portal-grid">
            <a href="buy.html" class="portal-card">
                <div class="portal-icon">🛒</div>
                <h2>我要买书</h2>
                <p>搜索心仪书籍，一键下单</p>
            </a>

            <a href="sell.html" class="portal-card">
                <div class="portal-icon">📖</div>
                <h2>我要卖书</h2>
                <p>填写书籍信息，快速发布</p>
            </a>
        </div>

        <div class="features">
            <div class="feature-item">
                <span>✅</span>
                <span>校内认证</span>
            </div>
            <div class="feature-item">
                <span>💰</span>
                <span>低价好书</span>
            </div>
            <div class="feature-item">
                <span>🚚</span>
                <span>校内配送</span>
            </div>
        </div>

        <div class="admin-link">
            <p>© 2026 校园二手书交易平台 | <a href="/admin" target="_blank">后台管理</a></p>
        </div>
    </div>
</body>
</html>
